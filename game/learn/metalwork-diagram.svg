<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="t d"><title id="t">Turning produced metal into a useful part</title><desc id="d">Produced metal must be cleaned and shaped, then measured and tested. A part can only be used if its dimensions and strength meet the job.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="#a95d3e"/></marker></defs><rect width="1200" height="360" rx="20" fill="#f8e9ce"/><path d="M0 289Q300 256 600 291T1200 291V360H0Z" fill="#a9664d"/><g font-family="Arial,sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#50372d"><text x="144" y="39">1 · METAL FEEDSTOCK</text><text x="447" y="39">2 · SHAPE</text><text x="756" y="39">3 · MEASURE + TEST</text><text x="1060" y="39">4 · USE</text></g><path d="M65 170h171l-15 65H79z" fill="#b7c5c3" stroke="#5c7576" stroke-width="8"/><path d="M82 188h136m-123 22h106" stroke="#e8eee2" stroke-width="8"/><text x="148" y="275" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#54605a">produced iron</text><path d="M243 177h60" stroke="#a95d3e" stroke-width="11" marker-end="url(#a)"/><rect x="335" y="111" width="223" height="119" rx="15" fill="#a9beb9" stroke="#5d7775" stroke-width="8"/><rect x="365" y="132" width="162" height="52" rx="8" fill="#db9a66" stroke="#76594c" stroke-width="6"/><path d="M388 96v54m80-54v54" stroke="#526d70" stroke-width="14"/><path d="M367 226h165" stroke="#6c7772" stroke-width="10"/><text x="446" y="275" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#54605a">form a part</text><path d="M566 177h56" stroke="#a95d3e" stroke-width="11" marker-end="url(#a)"/><path d="M660 123h210v104H660z" fill="#e3dfc7" stroke="#71807a" stroke-width="8"/><path d="M681 159h150m-150 25h117" stroke="#789ca0" stroke-width="7"/><path d="M760 121v106" stroke="#c08b5f" stroke-width="6"/><circle cx="841" cy="175" r="27" fill="#d2e7d