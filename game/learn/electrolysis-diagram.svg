<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">From buried ice to oxygen and hydrogen</title><desc id="desc">Ice is collected, melted and cleaned, then water and electricity enter an electrolyzer. Separate pipes carry oxygen to a habitat and hydrogen to later manufacturing.</desc>
<defs><linearGradient id="soil" x2="0" y2="1"><stop stop-color="#c98761"/><stop offset="1" stop-color="#823f3e"/></linearGradient><linearGradient id="steel" x2="1" y2="1"><stop stop-color="#f4ead6"/><stop offset=".48" stop-color="#a9bfc0"/><stop offset="1" stop-color="#547c87"/></linearGradient><linearGradient id="water" x2="0" y2="1"><stop stop-color="#8ff0e4"/><stop offset="1" stop-color="#347da3"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#2d3441" flood-opacity=".35"/></filter><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="#ae633e"/></marker></defs>
<rect width="1200" height="360" rx="20" fill="#fff8ea"/><path d="M0 230 Q180 205 350 230 Q550 250 740 225 Q980 205 1200 230 V360 H0Z" fill="url(#soil)"/>
<g font-family="Arial,sans-serif" fill="#4c302b" text-anchor="middle" font-weight="bold"><text x="130" y="32" font-size="22">1 · COLLECT ICE</text><text x="345" y="32" font-size="22">2 · MAKE WATER</text><text x="675" y="32" font-size="22">3 · SPLIT WATER</text><text x="1010" y="32" font-size="22">4 · USE BOTH GASES</text></g>
