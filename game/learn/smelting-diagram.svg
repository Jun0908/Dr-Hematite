<title id="t">Reducing iron oxide with hydrogen</title><desc id="d">An analyzed iron-oxide feedstock and hydrogen enter a heated reaction vessel. Under suitable conditions oxygen moves from the oxide to hydrogen, leaving iron and water as separate products.</desc>
