<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="t d"><title id="t">Making a building tile from regolith simulant</title><desc id="d">A sample of loose regolith is analyzed, sorted and pressed into shape. Controlled heating bonds particles into a solid tile, which is tested before construction use.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="#a95d3e"/></marker></defs><rect width="1200" height="360" rx="20" fill="#f7e8cb"/><path d="M0 292Q300 260 600 292T1200 291V360H0Z" fill="#ac6549"/><g font-family="Arial,sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#50372c"><text x="140" y="39">1 · SAMPLE</text><text x="400" y="39">2 · SORT + FORM</text><text x="711" y="39">3 · FIRE</text><text x="1040" y="39">4 · TEST + BUILD</text></g><path d="M54 220l50-77 49 14 65 72z" fill="#b56b4b" stroke="#75483a" stroke-width="8"/><path d="M96 144l26 35 36-23" fill="none" stroke="#d99670" stroke-width="7"/><text x="139" y="277" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#5c4739">loose regolith</text><path d="M232 177h64" stroke="#a95d3e" stroke-width="11" marker-end="url(#a)"/><rect x="326" y="99" width="173" height="145" rx="12" fill="#ded4bb" stroke="#777669" stroke-width="8"/><path d="M343 128h139m-135 22 63 40 68-40m-137 70h143" fill="none" stroke="#9b6850" stroke-width="9"/><text x="414" y="277" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#5c4739">selected + pressed</text><path d="M507 177h58" stroke="#a95d3e" stroke-width="11" marker-end="url(#a)"/><rect x="594" y="85" width="233" height="173" rx="17" fill="#aab5aa" stroke="#596e6c" stroke-width="8"/><rect x="620" y="113" width="181" height="120" rx="8" fill="#e89555" stroke="#85584a" stroke-width="6"/><path d="M649 210q24-64 44 0t42 0t43 0" fill="none" stroke="#ffe19a" stroke-width="10"/><text x="710" y="277" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#5c4739">controlled heating</text><path d="M836 177h61" stroke="#a95d3e" stroke-width="11" marker-end="url(#a)"/><path d="M934 133h187v92H934z" fill="#d1b390" stroke="#756b60" stroke-width="8"/><path d="M934 165h187M991 133v92m64-92v92" stroke="#aa8a70" stroke-width="5"/><path d="m969 245 25 23 47-55" fill="none" stroke="#4f9a6c" stroke-width="10"/><text x="1030" y="299" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#5c4739">strength + fit</text></svg>
