<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
<title id="t">MOXIE makes oxygen from Martian carbon dioxide</title><desc id="d">Thin Martian air containing carbon dioxide enters a compressor and a hot solid-oxide electrolysis cell. Oxygen leaves for collection while carbon monoxide is kept separate and handled safely.</desc>
