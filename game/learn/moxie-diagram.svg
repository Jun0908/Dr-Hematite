<g fill="#f7eee0" stroke="#a46853" stroke-width="5"><circle cx="87" cy="157" r="43"/><circle cx="133" cy="130" r="52"/><circle cx="184" cy="158" r="41"/></g><text x="135" y="164" text-anchor="middle" font-size="34" font-family="Arial,sans-serif" font-weight="bold" fill="#704839">CO₂</text><text x="135" y="243" text-anchor="middle" font-size="18" font-family="Arial,sans-serif" fill="#704839">thin atmosphere</text>
